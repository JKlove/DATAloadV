# DataloadV 双平台打包 CI
#
# 触发：workflow_dispatch（手动）/ push tag v*（发版）
# 流程：测试门禁（offscreen pytest，绿了才打包）→ PyInstaller（与本机共用同一份
#   dataloadv.spec，sys.platform 分支处理平台差异）→ 压 zip → upload artifacts
# 产物：DataloadV-{version}-macOS-arm64.zip / -win64.zip（onedir 压 zip；
#   未签名——macOS 首开右键→打开，Windows 更多信息→仍要运行）
# runner 不用 conda（慢）：setup-python 3.10 + pip 装齐（dev extra 含 pytest），
#   与 dlv conda 环境的等价性说明见 HANDOFF"打包"节
# 发版流程清单与打包红线见 PACKAGING_HANDOFF.md（打包与发版手册）

name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS (arm64)
    runs-on: macos-latest # Apple Silicon runner，与本机构建同架构
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖（pip：核心栈 + extra-readers + dev 测试件 + PyInstaller）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[extra-readers,dev]" pyinstaller

      - name: 测试门禁（offscreen；绿了才打包）
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: PyInstaller 打包
        run: python -m PyInstaller dataloadv.spec --noconfirm

      - name: 压 zip（-y 保留符号链接，保证 .app bundle 结构完整）
        id: zip
        run: |
          VER=$(python -c "import importlib.metadata; print(importlib.metadata.version('dataloadv'))")
          cd dist && zip -r -y "DataloadV-${VER}-macOS-arm64.zip" DataloadV.app
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: DataloadV-${{ steps.zip.outputs.ver }}-macOS-arm64
          path: dist/DataloadV-*-macOS-arm64.zip
          if-no-files-found: error

  build-win:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # PySide6/pyqtgraph 走 pip（runner 无 conda-forge Qt；pip 版在 win 正常）
      - name: 安装依赖（pip：核心栈 + extra-readers + dev 测试件 + PyInstaller）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[extra-readers,dev]" pyinstaller

      - name: 测试门禁（offscreen；绿了才打包——Windows 侧回归在此拦截）
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: PyInstaller 打包
        run: python -m PyInstaller dataloadv.spec --noconfirm

      - name: 压 zip
        id: zip
        shell: pwsh
        run: |
          $VER = python -c "import importlib.metadata; print(importlib.metadata.version('dataloadv'))"
          # DestinationPath 必须带 dist\ 前缀：相对路径落 CWD（仓库根），upload 去 dist\ 找就炸（坑 #60）
          Compress-Archive -Path dist\DataloadV -DestinationPath "dist\DataloadV-$VER-win64.zip"
          echo "ver=$VER" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: DataloadV-${{ steps.zip.outputs.ver }}-win64
          path: dist/DataloadV-*-win64.zip
          if-no-files-found: error
